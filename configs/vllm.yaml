# Inference config for the on-prem reasoner.
# Tested on 2x RTX 4090 (48GB total VRAM)
model: Qwen/Qwen2.5-72B-Instruct-AWQ
quantization: awq
tensor_parallel_size: 2
max_model_len: 32768
gpu_memory_utilization: 0.92
enforce_eager: false
trust_remote_code: false

# Sampling defaults — overridden per-call by the planner/reasoner/verifier
sampling:
  temperature: 0.3
  top_p: 0.9
  max_tokens: 2048
